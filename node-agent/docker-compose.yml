version: '3.8'

services:
  node-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x402-node-agent
    restart: unless-stopped
    ports:
      - "8080:8080"    # REST API
      - "9090:9090"    # Metrics
    environment:
      - LOG_LEVEL=info
      - RPC_URL=${RPC_URL:-ws://localhost:8545}
      - SESSION_MANAGER_ADDRESS=${SESSION_MANAGER_ADDRESS}
      - NODE_PRIVATE_KEY=${NODE_PRIVATE_KEY}
      - NODE_ADDRESS=${NODE_ADDRESS}
      - NODE_ID=${NODE_ID}
      - WG_INTERFACE=${WG_INTERFACE:-wg0}
      - FEE_RECIPIENT=${FEE_RECIPIENT}
      - POLLING_INTERVAL=${POLLING_INTERVAL:-30s}
      - SETTLE_INTERVAL=${SETTLE_INTERVAL:-10m}
      - REST_PORT=${REST_PORT:-8080}
      - METRICS_PORT=${METRICS_PORT:-9090}
      - RETRY_MAX=${RETRY_MAX:-5}
      - RETRY_DELAY=${RETRY_DELAY:-5s}
    volumes:
      - ./config:/app/config:ro
      - /var/run/wireguard:/var/run/wireguard:rw
    networks:
      - x402-network
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: x402-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - x402-network

  grafana:
    image: grafana/grafana:latest
    container_name: x402-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - x402-network

networks:
  x402-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: